# Agent OS Standards Index

base:
  process/ownership:
    description: A person owns every commit, pull request, approval and merge; an agent never lands work, and a system-wide tool is asked for before it is installed
  process/standards-index:
    description: Two-level index keyed by path relative to its section without the .md, one description line saying what the standard decides, every standard indexed and nothing else, and a consuming project's base section replaced whole by the sync at the pinned commit and never edited by hand
  process/standards-retrospective:
    description: The last step of every gate asks four questions of the diff, verifies a rewritten standard against shipped code and a rule about a tool's behaviour by a probe at its pinned version whose cases tell the claims apart and whose setup is shown, the tool's source deciding against its documentation, proposes a base change instead of editing it in place, presents every proposal to the owner and files the approved ones as one issue on patchbay-standards before the spec is done, linked to the pull request when it opens, a declined one marked by name, and keeps every standards edit approved by a person
  process/standards-sync:
    description: A consuming project takes base/ whole from one commit of patchbay-standards by scripts/sync-standards.sh, origin's default branch unless a ref is named and never the working tree, pins it in .version, holds the copy and its base section byte-identical to that commit with --check as a gate step, regenerates the base section alone with --index-only, syncs forward deliberately in its own change set with a CHANGELOG entry naming the old and new commit, has a base change that leaves a project's gate files behind name the project and the work in this repository's CHANGELOG and an issue there, writes nothing under .claude/commands so a gate-task step a base change asks for is the project's own gate spec after the sync, and has its CI check the sibling out at the pin read from .version
  process/verification-gate:
    description: One scripts/gate.sh runs every runnable step in a fixed order, exits 1 at the first failure after naming it and 2 when not run as the gate, reads the files git lists at the repository root, a work tree and its top asked of git, each listing written to a file with git's status checked and each path once, a listing git cannot make failing by name, by git's list, a tool reading .gitignore or a walk that first refuses what git ignores, every tracked file a committed .gitignore matches under the gate's paths refused at the first step, and fails a step's install of its pinned tools as itself before any tool checks the tree, then Docs, Version and the retrospective as judgment; each tool pinned exactly in one place, the script when there is no package manifest and otherwise the manifest resolved in a lockfile the gate runs locked, the runner pinned in the manifest where it can be, rules in a versioned config or the manifest's tool sections, CI runs the same script and checks nothing it does not, after installing the runner and any locked toolchain, with every action pinned to a commit and a cache only on a lockfile key, every step proven to fail by a negative test that asserts its status, its reason, nothing else where the reason is all a step reports and no later step reached, each case setting the whole of a copied directory it rests on, a change to a harness assertion shown by a mutation, a kept transcript one run, a rule set by a changed value and an unparsable value and file, a pin by a version that cannot install, a consuming project's script on this repository's skeleton, and the gate's files, its tool pins among them, changed only in their own spec
  python/errors:
    description: One root exception per package deriving from Exception with no narrower built-in, every name ending in Error, fields passed to Exception in order and kept as attributes with the message built from them, no field named after a third party's method, fields typed as plain values so the errors module is a leaf, no built-in exception leaving a public method, and an error raised in place of another chained from it except a lookup's own KeyError
  python/events:
    description: An event is a frozen model with a dotted lowercase past-tense name fixed per class, typed payload fields, a version, a source and a correlation id, stamped in UTC, a given time accepted when its zone answers zero for no particular instant and held as UTC at the same instant; the synchronous in-process bus delivers in subscription order over a snapshot, never alters an event, runs every subscriber before raising one error chained from the first and catches Exception only; subscribe refuses a bad type or subscriber where it is made and returns a cancellable Subscription that is a context manager; the subscriber protocol is generic and contravariant with a positional-only call
  python/layout:
    description: One module per concern under src, no two modules sharing a basename but __init__.py, a testing subpackage for consumers' tests shipped in the wheel and never re-exported, __init__.py holding only re-exports, __all__ and a __version__ read from the installed metadata with no fallback, a test holding the root's surface to __all__ with submodules left out, and modules importing in one direction from the errors leaf up, built in that order with the gate green after each and a protocol kept beside the API that takes it
  python/models:
    description: Every model derives from one public base frozen by the class keyword on every class line, closed, finite and strict; its own entry points refuse as the package's validation error chained from pydantic's while validation run for something else raises pydantic's; pydantic's validating classmethods are wrapped and never restated, __init__ carries the base-init marker, data in JSON's form has one entry point, containers are read-only, ids are non-empty, and a quantity every implementation computes alike is one exact method
  python/toolchain:
    description: One tool per job in a uv Python package, configured only in pyproject.toml with .pre-commit-config.yaml and .python-version the two files beside it, uv_build in the range uv init writes containing the pinned uv, every tool run through uv run --locked, the family's 3.12 floor and 100-column width, runtime dependencies as ranges from the version the gate ran to the next major with every package imported directly declared and the lock's change shown, ruff ALL ignoring only what the tree trips wrongly and the conflicts ruff warns of, a suppression only where the code cannot change and coded with its reason beside it, mypy strict over src and tests, strict pytest, ruff-only local hooks, and the gate's tool steps in the order format, lint, types, tests, ruff and mypy given git's list and pytest walking after a refusal; pins, locking and CI stay the gate standard's
  python/typing:
    description: Distinct keys are distinct NewTypes, a protocol's data members are read-only properties and its method parameters positional-only with isinstance the only runtime check, generics use PEP 695 syntax as ruff asks, a module re-exports through __all__ under implicit_reexport false, and no module whose annotations pydantic reads carries the future annotations import
  testing/tests:
    description: Tests mirror the source one module per module, every module under tests a basename of its own with no __init__.py and one conftest.py at most above every test taking its fixtures, files read from pytest's root, strategies that generate only valid inputs with known counterexamples pinned, [0-9] and never \d, and coded type ignores holding mypy's refusals; the contract suite ships in the protocol package's testing subpackage as unprefixed functions listed in one tuple, fails with an AssertionError subclass with fields and never with assert or pytest, works out its expectations from the contract with values one float past a bound, and is proven by a fake broken each way asserting its reason and passed by a correct one at the widest bounds
vital:
  float-writer:
    description: A float in a preset is written by a port of nlohmann's Grisu2 and format, never repr or a rule fitted to the corpus, held to the library's own output by a recorded vectors file
  measures:
    description: Vital's audio is not sample-reproducible, so every audio assertion is a measure against a named tolerance whose comment gives the probe its number came from, the measure being the probe's own computation written once; what Vital holds after a set is compared exactly with the map's value, and how far its display lands from the display set is a count the probe made, the test and the probe running one sequence over the rows of files both test trees read, a row's step read by one helper
  parameter-map:
    description: The map is measured from the plugin by the census and committed as data recording the machine it ran on and the plugin it measured and used with no other, both outputs staged then renamed together and the first put back when the second fails, one scale built to fit by, a parameter's id its preset key with pedalboard's key read only by the host, normalized to preset linear or indexed in exact float32 by a fused multiply-add with the span kept by its bounds and a grid half rounded away from zero, preset to display one of six measured curves in the plugin's units by one suffix table with the record held together in float32 so another libm still reads it and its displayed ends computed in one place, switches booleans and other names choices told apart by index with a made-up name never colliding, a choice taking a whole index only, a display, the held preset, a display's preset and a set's display coming back exactly but at two exceptions stated over values and never a name, a held power of two the normalized path lands short of and a preset sharing its display with a neighbour, a set there holding the normalized path's value within one neighbouring double, each exception held at rows a file records and counted by the failures it leaves, a claim about every value counted over every float32 by exponent wherever the count reproduces the arithmetic and HELD on every group, and settings_keys.txt derived from it with the census refusing a list that would forget a key the format knows
  plugin-state:
    description: The plugin's state is a preset's text in three containers read and written by our own codec with tuning held as an unread section, the containers read once at load and reused by every load, the plugin upgrading, delaying and re-quantizing what it loads and a load after the starting state with no set between moving volume's unheld value at or below its floor while an off-grid chorus_feedback is kept, so its state is never read back as the preset, every call into it its own guard, the load's four included, keeping the process's floating-point environment with functions from the first library holding them and held by unit tests that need no plugin and a fake plugin that changes the rounding mode and records the mode each call found, pedalboard's wrappers held and its native objects never, nothing pedalboard raises leaving the host from any reach and no built-in's error for a value that is no number, a host id not hosted or a state with no settings, the map refused on another machine or instrument or version where first used by one error naming which, a measurement putting each parameter back by its normalized value and loading the starting state once however it ends and refusing a row with other keys, a render asking one sample more and returning the first asked for and refusing a bool, and the integration module loading Vital once
  preset-file:
    description: Where each part of a .vital file lives and how it is held, known keys meaning Vital has ever written them, a dropped one kept, and derived from the parameter map, a per-slot float joined to its slot reversibly, all 64 slots kept, a section as the text the file held, the plugin state's tuning held the same way and told from a section of that name by where a change is, a key Vital is not known to write refused wherever it is and an unknown section kept, nothing after the object but one newline and a section nesting too deeply refused through one decoder helper, files replaced whole or not at all by the files module which stages every file before renaming any, reads only a file a later rename could force back and puts an earlier one back when a later rename fails, then flushes each directory once as a best effort that logs a warning rather than failing, and two presets the same when they write the same bytes
  preset-tests:
    description: No preset or media of Vital's is committed, a test reads the installed presets against a committed manifest whose length is the count, skips saying so where they are absent, the unit suite's one real file is an owner's save with its media replaced, and a test of the hosted plugin skips by name without it or where the map was measured on another machine, the plugin's own state never committed
