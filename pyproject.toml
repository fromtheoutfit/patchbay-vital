# The one configuration file of this repository: every tool is configured under [tool.*] here and
# nowhere else (no setup.py, setup.cfg, requirements*.txt, tox.ini, .flake8, mypy.ini, pytest.ini,
# .ruff.toml or uv.toml). .pre-commit-config.yaml beside it registers hooks and configures no tool.
#
# Two kinds of entry. The gate's: the [tool.*] sections, and the pins in [dependency-groups] dev of
# the tools the gate runs (ruff, mypy and pytest) with what uv.lock resolves for them. [tool.uv]
# pins the uv that gate steps 2-5 of scripts/gate.sh run under, and the rest are the rule set those
# steps read (ruff format, ruff check, mypy, pytest), each told by flag to read this file. They are
# gate files and change only in the gate's own spec, with a person
# (agent-os/standards/base/process/verification-gate.md, "Pinned" and "The gate's own files change
# only in their own spec"). The package's: [project], [build-system] and the rest of
# [dependency-groups] (hypothesis, a test library pytest runs, and pre-commit, which no gate step
# runs), which change in any spec; adding a dependency is a Decision in that spec's shape.md (what
# it does, why the standard library cannot, its license).

[project]
name = "patchbay-vital"
version = "0.0.1"
description = "patchbay adapter for Vital: the .vital preset format, the VST3 parameter map and unit conversions, and sound-design semantics as data."
readme = "README.md"
license = "MIT"
# Stated, not left to a default: uv_build applies no license glob, and without this the wheel
# carries License-Expression and not the MIT text the license requires to travel with it.
license-files = ["LICENSE"]
authors = [
    { name = "Michael Witwicki", email = "michael@theout.fit" }
]
requires-python = ">=3.12"
# None yet. A runtime dependency is added by the spec that first imports it, patchbay-core among
# them, as a Decision there, and as a range: the version the gate ran to the next major.
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# The uv this repository runs under: any other uv refuses every command that reads this project's
# settings (uv sync, uv run, uv lock among them), so a local `--locked` run and CI's read uv.lock
# with the same uv: the gate's first uv command, step 2's `uv sync --locked`, fails by name
# (negative test o). CI's astral-sh/setup-uv reads this key to choose the uv it installs, so the
# version is written once. Bumped deliberately, in the gate's own spec, and the gate rerun.
# uv_build needs no module-name here: the distribution name gives the import name, patchbay_vital.
[tool.uv]
required-version = "==0.13.7"

# Every entry pinned exactly, each with the date it was published, and resolved in uv.lock; each is
# a Decision in the spec that added it. ruff, mypy and pytest are the tools the gate runs, under
# `uv run --locked`, so a pin changed here without re-locking fails the gate rather than being
# rewritten: they are gate pins, bumped deliberately in the gate's own spec, and the gate rerun.
# hypothesis (a test library pytest runs) and pre-commit (the local hook runner, which no gate step
# runs; .pre-commit-config.yaml's minimum_pre_commit_version follows its pin) are the package's,
# changed in any spec as a Decision there.
[dependency-groups]
dev = [
    "ruff==0.17.4",          # published 2026-11-05; linter and formatter, gate steps 2-3
    "mypy==2.4.1",           # published 2026-10-28; type checker, gate step 4
    "pytest==9.2.0",         # published 2026-10-27; test runner, gate step 5
    "hypothesis==6.170.14",  # published 2026-10-30; property-based tests, run by pytest
    "pre-commit==4.7.0",     # published 2026-10-12; the local hook runner, not run by the gate
]

# ruff: gate steps 2 (format --check) and 3 (check). The formatter is ruff format; there is no black.
[tool.ruff]
# The interpreter the code targets; the floor of requires-python, stated so a rule set never
# silently follows a raised floor.
target-version = "py312"
# 100: wide enough that a typed signature or a pydantic field with its description stays on one
# line, narrow enough to read in a split editor and a GitHub diff.
line-length = 100

[tool.ruff.lint]
# Every rule, then the ones this tree proved wrong, each with its reason. A rule the tree trips
# is fixed in the code when the rule is right; it is ignored here only when it is wrong for this
# tree, so the list is what the tree taught, not a list copied from memory.
select = ["ALL"]
# What the first run of ALL with this list empty gave (the bootstrap spec's
# verification/ruff-all-empty-ignore.txt).
ignore = [
    # ruff warns that D203 and D211 are incompatible and drops D203 itself; said here so the choice
    # is explicit: no blank line between a class line and its docstring.
    "D203",
    # ruff warns that D212 and D213 are incompatible and drops D213 itself; said here so the
    # choice is explicit: a multi-line docstring's summary starts on its first line.
    "D213",
    # ruff warns that COM812 conflicts with the formatter, which owns trailing commas.
    "COM812",
    # The license is the repository's LICENSE file; a copyright header in every source file is
    # noise every diff pays for and no reader needs.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # assert is how a pytest test states its expectation; pytest rewrites it to report values.
    "S101",
    # tests/ is a tree pytest collects from testpaths, never a package anything imports, so it
    # carries no __init__.py. The convention this rests on: one basename per test file across
    # tests/, which mypy (files = ["src", "tests"]) refuses to break as a duplicate module.
    "INP001",
]

# mypy: gate step 4, over the package and the tests.
[tool.mypy]
strict = true
# What a bare `uv run --locked mypy` walks. The gate gives mypy git's list of the .py and .pyi
# files under these instead (scripts/gate.sh step 4), so it reads exactly the files git lists.
files = ["src", "tests"]
# The interpreter the types are checked against, the floor of requires-python.
python_version = "3.12"
# Code the checker proves unreachable is a bug, not dead weight; strict does not turn this on.
warn_unreachable = true
# Strict already implies it; stated so a name is exported only by __all__ or an explicit
# `from x import y as y`, and the package's surface is what it says.
implicit_reexport = false
# An untyped third-party package gets its own [[tool.mypy.overrides]] block here, with
# `module = ["name.*"]`, `ignore_missing_imports = true` and a comment saying which package and
# why; never a global ignore. None is needed yet.

# pytest: gate step 5.
[tool.pytest.ini_options]
testpaths = ["tests"]
# -q: the gate's transcript is read by a person. --strict-markers: an unregistered marker is a
# typo, so it fails. --strict-config: a key pytest does not know in this section fails the run
# rather than being ignored with a warning (agent-os/standards/base/python/toolchain.md, "pytest
# and hypothesis"). The gate adds -p no:doctest on its own command line, so pytest reads no .txt
# under tests/; this line stays as that standard fixes it.
addopts = "-q --strict-markers --strict-config"
